schema_version: 1
profile_baseline:
  id: hamaguchi_profile
  label: Hamaguchi-style fixed-path input-shaped profile
  category: slosh_specific_motion_generation
  implementation: scout_profile_baselines_generated_external_profile
  generator_script: src/scout_apps/control/scout_profile_baselines/scripts/generate_hamaguchi_profile.py
  implementation_script: src/scout_apps/control/scout_profile_baselines/scripts/hamaguchi/generate_profile.py
  method_name: HAMAGUCHI_STYLE
  paper_reference: docs/重要文档/论文参考总结/Hamaguchi和Taniguchi - 2002 - TRANSFER CONTROL AND CURVED PATH DESIGN FOR CYLINDRICAL LIQUID CONTAINER圆柱形液体容器的传输控制与弯曲路径设计.pdf
  approximation_note: >-
    Uses the paper's two-impulse input shaping timing on a fixed path and adds
    conservative curvature-aware speed caps. It does not redesign path geometry,
    so it is a Hamaguchi-style fixed-path benchmark baseline rather than an exact
    curved-path reproduction.
  online: false
  interface_type: profile_csv_plus_common_tracker
  output_schema: profile_tracking_common
  method_table_role: supplementary_slosh_profile_table
  main_table_eligible_if_preflight_passes: separate_supplementary_table
  common_limits:
    v_max_mps: 0.8
    omega_max_radps: 1.2
    a_max_mps2: 0.6
    alpha_max_radps2: 1.2
    allow_reverse: false
  offline_liquid_model_parameters:
    omega_n_rad_s: required_cli_argument
    damping_ratio: default_0p05
  information_boundary:
    allowed_inputs:
      - offline_fixed_path
      - offline_liquid_model_parameters
      - common_limits
    monitor_feedback_during_test_allowed: false
    runtime_profile_regeneration_allowed: false
    ros_topic_subscription_allowed: false
    online_liquid_feedback: false
  shared_runtime_chain:
    tracker: scout_local_planner_external_profile
    command_gate: common_profile_tracking_policy
    metrics: shared_fixed_path_metrics
