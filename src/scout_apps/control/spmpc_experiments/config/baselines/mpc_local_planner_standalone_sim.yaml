MpcLocalPlannerROS:
  odom_topic: /odom

  robot:
    type: "unicycle"
    unicycle:
      max_vel_x: 0.8
      max_vel_x_backwards: 0.0
      max_vel_theta: 1.2
      acc_lim_x: 0.8
      dec_lim_x: 0.8
      acc_lim_theta: 2.0

  footprint_model:
    type: "polygon"
    vertices: [[0.31, 0.2925], [0.31, -0.2925], [-0.31, -0.2925], [-0.31, 0.2925]]
    is_footprint_dynamic: false

  collision_avoidance:
    min_obstacle_dist: 0.25
    enable_dynamic_obstacles: false
    force_inclusion_dist: 0.5
    cutoff_dist: 2.5
    include_costmap_obstacles: true
    costmap_obstacles_behind_robot_dist: 1.5
    collision_check_no_poses: 5

  grid:
    type: "fd_grid"
    grid_size_ref: 20
    dt_ref: 0.2
    xf_fixed: [false, false, false]
    warm_start: true
    collocation_method: "forward_differences"
    cost_integration_method: "left_sum"
    variable_grid:
      enable: false
      min_dt: 0.0
      max_dt: 10.0
      grid_adaptation:
        enable: true
        dt_hyst_ratio: 0.1
        min_grid_size: 2
        max_grid_size: 50

  planning:
    objective:
      type: "quadratic_form"
      quadratic_form:
        state_weights: [2.0, 2.0, 0.25]
        control_weights: [0.1, 0.05]
        integral_form: false
    terminal_cost:
      type: "quadratic"
      quadratic:
        final_state_weights: [10.0, 10.0, 0.5]
    terminal_constraint:
      type: "none"
      l2_ball:
        weight_matrix: [1.0, 1.0, 1.0]
        radius: 5

  controller:
    outer_ocp_iterations: 1
    xy_goal_tolerance: 0.2
    yaw_goal_tolerance: 0.2
    global_plan_overwrite_orientation: true
    global_plan_prune_distance: 1.0
    allow_init_with_backward_motion: false
    max_global_plan_lookahead_dist: 2.0
    force_reinit_new_goal_dist: 1.0
    force_reinit_new_goal_angular: 1.57
    force_reinit_num_steps: 0
    prefer_x_feedback: false
    publish_ocp_results: true

  solver:
    type: "lsq_lm"
    ipopt:
      iterations: 100
      max_cpu_time: -1.0
      ipopt_numeric_options:
        tol: 1e-4
      ipopt_string_options:
        linear_solver: "mumps"
        hessian_approximation: "exact"
    lsq_lm:
      iterations: 10
      weight_init_eq: 2
      weight_init_ineq: 2
      weight_init_bounds: 2
      weight_adapt_factor_eq: 1.5
      weight_adapt_factor_ineq: 1.5
      weight_adapt_factor_bounds: 1.5
      weight_adapt_max_eq: 500
      weight_adapt_max_ineq: 500
      weight_adapt_max_bounds: 500
