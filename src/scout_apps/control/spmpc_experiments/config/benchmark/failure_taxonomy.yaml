schema_version: 1
notes:
  - "Failure codes separate dependency, planner, task, fairness, monitor, and analysis failures."
  - "Codes are for metadata/reporting first; they do not change planner runtime behavior."

status_codes:
  success:
    - GOAL_REACHED

  task_failure:
    - TIMEOUT_NO_GOAL
    - COLLISION_OR_EMERGENCY_STOP
    - TRACKING_DIVERGED
    - CLOSED_LOOP_COLLISION_OR_GOAL_FAILURE

  planner_failure:
    - PLANNER_NO_CMD
    - PLANNER_INVALID_CMD
    - PLANNER_STATUS_ERROR
    - SOLVER_FAILED

  system_failure:
    - TF_ERROR
    - ODOM_TIMEOUT
    - LOCALIZATION_LOST
    - ROS_MASTER_LOST
    - BAG_RECORD_FAILED

  precheck_or_dependency:
    - DEPENDENCY_SKIPPED
    - PRECHECK_FAILED
    - MPC_PLANNER_NOT_READY
    - LT_DWA_NOT_INSTALLED
    - LT_DWA_VENDOR_INCOMPLETE
    - LT_DWA_ADAPTER_NOT_READY
    - LT_DWA_SMOKE_GATE_REQUIRED

  fairness_failure:
    - FAIRNESS_VIOLATION
    - COMMAND_GATE_TOO_ACTIVE
    - PARAMETER_NOT_FROZEN
    - NON_STRICT_FRESH_SIM
    - MONITOR_USED_FOR_CONTROL

  monitor_failure:
    - SLOSH_MONITOR_MISSING
    - SLOSH_MONITOR_NO_CHANGE_DETECTED
    - SLOSH_MONITOR_BAD_DT

  analysis_failure:
    - ANALYSIS_FAILED
    - REQUIRED_TOPIC_MISSING

method_current_failure_classification:
  lt_dwa:
    as_of: 2026-06-21
    current_code: CLOSED_LOOP_COLLISION_OR_GOAL_FAILURE
    previous_code: COMMAND_GATE_TOO_ACTIVE
    evidence:
      run_root: /data/a/scout_sim_replacement/results/proxy_baseline_mainline_lt_dwa_rate_decouple_20260621_stampfix_closed_loop
      cmd_topic: /benchmark/cmd_vel_raw
      cmd_topic_rate_hz: 25.0
      cmd_topic_max_gap_sec: 0.041
      cmd_vel_drive_rate_hz: 30.0
      cmd_vel_drive_max_linear_x_mps: 0.6
      no_valid_cmd_max_duration_sec: 0.0
      no_go_flags:
        - GOAL_NOT_REACHED
      observed_status: ROBOT_IN_COLLISION
    notes:
      - "Command-cadence / guard-timeout failure is resolved: /benchmark/cmd_vel_raw has no >0.3s gaps and /cmd_vel_drive is no longer pinned at 0.18 m/s."
      - "LT-DWA remains NO-GO because the closed-loop smoke still diverges into collision/goal failure. Diagnose collision, tracking, and local target separately from command gate."

main_table_blocking_codes:
  - DEPENDENCY_SKIPPED
  - PRECHECK_FAILED
  - LT_DWA_ADAPTER_NOT_READY
  - LT_DWA_SMOKE_GATE_REQUIRED
  - FAIRNESS_VIOLATION
  - COMMAND_GATE_TOO_ACTIVE
  - PARAMETER_NOT_FROZEN
  - NON_STRICT_FRESH_SIM
  - MONITOR_USED_FOR_CONTROL
  - REQUIRED_TOPIC_MISSING
