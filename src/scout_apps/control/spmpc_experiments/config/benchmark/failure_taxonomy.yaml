schema_version: 1
notes:
  - "Failure codes separate dependency, planner, task, fairness, monitor, and analysis failures."
  - "Codes are for metadata/reporting first; they do not change planner runtime behavior."

status_codes:
  success:
    - GOAL_REACHED

  task_failure:
    - TIMEOUT_NO_GOAL
    - COLLISION_OR_EMERGENCY_STOP
    - TRACKING_DIVERGED
    - CLOSED_LOOP_COLLISION_OR_GOAL_FAILURE

  planner_failure:
    - PLANNER_NO_CMD
    - PLANNER_INVALID_CMD
    - PLANNER_STATUS_ERROR
    - SOLVER_FAILED

  system_failure:
    - TF_ERROR
    - ODOM_TIMEOUT
    - LOCALIZATION_LOST
    - ROS_MASTER_LOST
    - BAG_RECORD_FAILED

  precheck_or_dependency:
    - DEPENDENCY_SKIPPED
    - PRECHECK_FAILED
    - MPC_PLANNER_NOT_READY
    - LT_DWA_NOT_INSTALLED
    - LT_DWA_VENDOR_INCOMPLETE
    - LT_DWA_WRAPPER_SMOKE_GATE_REQUIRED

  fairness_failure:
    - FAIRNESS_VIOLATION
    - COMMAND_GATE_TOO_ACTIVE
    - PARAMETER_NOT_FROZEN
    - NON_STRICT_FRESH_SIM
    - MONITOR_USED_FOR_CONTROL

  monitor_failure:
    - SLOSH_MONITOR_MISSING
    - SLOSH_MONITOR_NO_CHANGE_DETECTED
    - SLOSH_MONITOR_BAD_DT

  analysis_failure:
    - ANALYSIS_FAILED
    - REQUIRED_TOPIC_MISSING

method_current_failure_classification:
  lt_dwa:
    as_of: 2026-06-24
    current_code: TRACKING_DIVERGED
    previous_code: TIMEOUT_NO_GOAL
    evidence:
      implementation: src/scout_apps/control/lt_dwa_official_wrapper
      reference_source: third_party/LT_DWA
      benchmark_launch: src/scout_apps/control/spmpc_experiments/launch/sim/run_lt_dwa_fixed_path_sim.launch
      benchmark_config: src/scout_apps/control/spmpc_experiments/config/baselines/lt_dwa_official_wrapper_standalone_sim.yaml
      cmd_topic: /benchmark/cmd_vel_raw
      status_topic: /baseline/lt_dwa/status
      diagnostics_topic: /baseline/lt_dwa/diagnostics
      worker_result_topic: /baseline/lt_dwa/worker_result
    notes:
      - "Baseline id lt_dwa now refers to the official LT-DWA ROS Noetic core through lt_dwa_official_wrapper, not the retired Scout-owned adapters."
      - "Visible S-curve smoke showed the official wrapper can drive Scout, but path tracking and endpoint convergence remain unstable."
      - "Keep formal main-table use blocked by LT_DWA_WRAPPER_SMOKE_GATE_REQUIRED until a strict fresh-sim gate passes."

main_table_blocking_codes:
  - DEPENDENCY_SKIPPED
  - PRECHECK_FAILED
  - LT_DWA_WRAPPER_SMOKE_GATE_REQUIRED
  - FAIRNESS_VIOLATION
  - COMMAND_GATE_TOO_ACTIVE
  - PARAMETER_NOT_FROZEN
  - NON_STRICT_FRESH_SIM
  - MONITOR_USED_FOR_CONTROL
  - REQUIRED_TOPIC_MISSING
