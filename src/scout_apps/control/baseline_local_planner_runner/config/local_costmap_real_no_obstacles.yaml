# Real-robot costmap for the obstacle-free fixed-path comparison.
#
# This file intentionally disables obstacle and inflation costs because the
# current continuous SPMPC fixed-path mainline also runs with obstacle_enable
# disabled. Do not reuse this config for collision-avoidance experiments.
controller_frequency: 10.0

local_costmap:
  global_frame: map
  robot_base_frame: base_link
  footprint: [[0.31, 0.2925], [0.31, -0.2925], [-0.31, -0.2925], [-0.31, 0.2925]]
  transform_tolerance: 2.0
  update_frequency: 5.0
  publish_frequency: 0.0
  static_map: false
  rolling_window: true
  width: 20.0
  height: 20.0
  resolution: 0.05
  plugins:
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  inflation_layer:
    enabled: false
    cost_scaling_factor: 3.0
    inflation_radius: 0.0
