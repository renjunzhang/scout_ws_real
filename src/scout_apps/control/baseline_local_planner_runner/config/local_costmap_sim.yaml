controller_frequency: 10.0

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  transform_tolerance: 1.0
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    observation_sources: scan
    scan:
      data_type: LaserScan
      topic: /scan_front
      sensor_frame: nanoscan3_front
      marking: true
      clearing: true
      obstacle_range: 4.0
      raytrace_range: 4.5
      inf_is_valid: true

  inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0
    inflation_radius: 0.5
