# Side-view RealSense D435i + ArUco visual height pipeline (RA-L D5).
#
# Container has ArUco markers attached to its sides; the markers anchor a ROI
# on the colour image and provide the mm-per-pixel scale. Hough/Canny finds
# the liquid line within the ROI; the height is the perpendicular distance
# from a fiducial (top-edge ArUco) down to the liquid line, in mm.

visual:
  camera: realsense_d435i
  topics:
    color: /camera/color/image_raw
    info: /camera/color/camera_info
    output_height: /slosh/h_visual
    output_quality: /slosh/h_visual_quality
  aruco:
    dictionary: DICT_4X4_50
    marker_size_mm: 30
    n_markers_on_container: 2     # one at top edge, one at fixed offset for scale
    top_marker_id: 0
    scale_marker_id: 1
    detector_params:
      adaptiveThreshWinSizeMin: 5
      adaptiveThreshWinSizeMax: 23
      adaptiveThreshWinSizeStep: 6
  roi:
    method: aruco_anchored        # ROI placed below top_marker, width = scale_marker offset
    margin_px: 8
    height_below_top_marker_mm: 80   # how far below the top marker to look for liquid
  liquid_edge:
    method: canny_hough
    blur_kernel: 5
    canny_low: 40
    canny_high: 140
    hough_threshold: 25
    hough_min_line_length_px: 30
    hough_max_line_gap_px: 5
    angle_tolerance_deg: 8        # accept lines within this of horizontal
  publishing:
    rate_hz: 30
    drop_if_no_aruco: true
    drop_if_no_line: true
  static_baseline:
    record_first_n_seconds: 3.0   # capture liquid baseline before motion
    use_baseline_as_zero: true
  sync:
    tolerance_ms: 50              # pair /slosh/height with /image_raw within this
