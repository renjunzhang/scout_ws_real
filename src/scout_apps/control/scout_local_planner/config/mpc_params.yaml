# Scout Mini MPC 局部规划器参数（实物）

# =============================================================================
# MPC 参数
# =============================================================================
mpc:
  # 预测参数
  N: 40                    # 预测步长
  dt: 0.05                  # 时间步长 (s)
  cmd_vel_lead_time: -1.0   # 输出速度前瞻时间；<0 沿用 0.5*dt，实物保持旧策略
  
  # 状态权重（Frenet 误差）
  # 注：change #11 修复了 OSQP P 矩阵 2x 系数，此处权重值已做相应调整
  Q_el: 0.5                # 纵向误差权重（沿路径方向）
  Q_ec: 36.0               # 横向误差权重（更贴路径）
  Q_etheta: 15           # 航向误差权重 - 减少直线摇摆
  Q_v: 9.0                 # 速度跟踪权重（修复后 v_ref 目标正确）
  use_contour_lag: true    # 启用 contour + lag 误差结构
  Q_contour: 32.0          # contour（横向误差）权重
  Q_lag: 0.5               # lag（纵向误差）权重
  enable_omega_ff: true    # 启用角速度前馈
  Q_omega_ff: 2.5          # 角速度前馈权重（修复后 omega_ref 目标正确）
  terminal_factor_ec: 5.0
  terminal_factor_etheta: 3.0  # 提高终端航向权重
  terminal_factor_v: 2.0
  terminal_ramp_steps: 5       # 渐进式终端权重：最后 5 步线性递增
  
  # 控制权重
  R_a: 0.4                 # 加速度权重
  R_omega: 2.0             # 角速度权重
  
  # 控制变化率权重（平滑控制）
  R_da: 0.5                # 加速度变化权重——配合 jerk 约束提高
  R_domega: 5.0            # 角速度变化权重 - 适当降低以提高响应

  # 控制变化率约束（硬约束）
  constrain_omega_rate: true
  constrain_accel_rate: true
  
  # 液体晃动权重（第 2 步启用）
  Q_slosh: 0.0             # 设为 0 表示不启用晃动抑制
  slosh_height_max: 0.05   # 液面高度约束 (m)
  enable_slosh_box_constraint: false  # 第一版盒约束代理（ETA_X/ETA_Y），默认关闭

# =============================================================================
# 车辆参数（Scout Mini）
# =============================================================================
vehicle:
  # 速度约束
  v_max: 3.0               # 最大线速度 (m/s) - 实物保守，降低以减少刹车时打滑
  v_min: 0.0               # 最小线速度 (m/s)，禁用倒车
  omega_max: 1.5           # 最大角速度 (rad/s) QP硬约束；1.0→1.5（原1.0因定位漂移保守，可回退）
  
  # 加速度约束
  a_max: 2.0               # 最大线加速度 (m/s²) - 提高以增强加减速能力
  alpha_max: 2.5           # 最大角加速度 (rad/s²) - 降低以平滑转向
  j_max: 4.0               # 最大线加加速度 (m/s^3)——提高以减少加减速响应滞后
  
  # 车辆几何
  track_width: 0.456       # Scout Mini 轮距 (m)
  wheelbase: 0.0           # 差速轮设为 0

# =============================================================================
# 路径处理参数
# =============================================================================
path_handler:
  lookahead_distance: 0.50  # 前视距离 (m) - 降低以减少切弯
  goal_tolerance: 0.20     # 到达目标位置容差 (m) - 实物放宽
  yaw_tolerance: 0.2       # 到达目标航向容差 (rad) - 进一步放宽
  goal_reached_max_speed: 0.08  # 仅在低速时允许切到 REACHED，避免高速判到达后惯性冲过头
  goal_reached_max_omega: 0.15  # 仅在低角速度时允许切到 REACHED
  goal_capture_distance: 0.25   # 终点捕获区；进入后维持最低参考速度，避免提前停死
  goal_capture_min_speed: 0.00  # 捕获区最低参考速度 (m/s)
  path_timeout: 5.0        # 路径超时时间 (s)
  publish_smoothed_path: true         # 是否发布平滑路径
  smoothed_path_topic: "/scout/global_path_smooth"  # 平滑路径话题名
  smoothed_path_points: 80            # 平滑路径采样点数
  window_back: 4                      # 样条窗口向后点数
  window_forward: 48                   # 样条窗口向前额外点数
  s_jump_threshold: 0.8               # 弧长跳变阈值 (m) - 增大以容忍定位抖动
  resample_spacing: 0.05              # 路径重采样间隔 (m)
  max_lat_accel: 2.0                  # 最大横向加速度 (m/s^2)
  speed_profile_omega_max: 1.5        # 规划层角速度上限（与 vehicle/omega_max 一致）；显式配置避免自动桥接后难以排查
  min_ref_speed: 0.0                  # 参考速度下限 (m/s)
  time_parameterize: true             # 启用时间化速度规划 v(s)
  speed_profile_ds: 0.05              # 速度曲线采样间隔 (m)
  max_tan_accel: 2.0                  # 最大切向加速度 (m/s^2) - 提高以加快速度建立
  max_tan_decel: 1.0                  # 最大切向减速度 (m/s^2) - 提高以增强制动收敛
  goal_speed: 0.0                     # 末端期望速度 (m/s)
  use_bspline_smoothing: false        # 关闭局部 B-spline 平滑（提高贴合度）
  bspline_samples_per_segment: 12      # 每段采样点数
  path_change_threshold: 0.3           # 路径相似性阈值 (m)，低于此值视为重复路径，跳过重置

# =============================================================================
# 节点参数
# =============================================================================
control_rate: 20.0         # 控制频率 (Hz)——20 Hz 与 MPC dt=0.05 对齐
base_frame: "base_link"    # 机器人坐标系
map_frame: "map"           # 地图坐标系
verbose: false             # 是否输出调试信息

# =============================================================================
# 液体晃动模型参数（P0-A: 状态注入）
# =============================================================================
slosh:
  container_radius: 0.0185   # 37 mm 试管内半径 (m)
  liquid_height: 0.058       # 当前试管液面高度 (m)
  liquid_density: 1000.0     # 液体密度 (kg/m³)
  damping_ratio: 0.05        # 37 mm 水试管采集阶段初始阻尼比
  mode_index: 1              # 晃动模态阶数
  offset_x: 0.0              # 容器相对 base_link X 偏移 (m)
  offset_y: 0.0              # 容器相对 base_link Y 偏移 (m)
  use_parabola_term: true    # 是否使用抛物面修正
  use_linear_model: true     # 使用线性模型

# =============================================================================
# 加速度估计 EMA 滤波
# =============================================================================
slosh_estimator:
  accel_filter_alpha: 0.3    # EMA 滤波系数 (0,1]，越小越平滑
  use_imu_lateral_accel: false  # 是否使用 IMU 横向加速度替代 v*omega
  use_imu_yaw_rate: true        # 当前默认安全配置：使用 IMU 角速度 z 替代 odom omega
  use_imu_alpha_z: false        # 是否使用 IMU 角速度差分得到 alpha_z
  imu_topic: /imu/data          # IMU 话题
  imu_filter_alpha: 0.3         # IMU 数据 EMA 滤波系数
  imu_ay_bias_compensation_enable: true  # 阶段 3：是否对 IMU ay 做静止零偏扣除
  imu_ay_bias_init_duration: 3.0         # 估计 ay 零偏所需的连续静止时长 (s)
  imu_ay_bias_static_v_max: 0.03         # 判定静止的最大 |v| (m/s)
  imu_ay_bias_static_omega_max: 0.03     # 判定静止的最大 |omega| (rad/s)
  imu_ay_bias_min_samples: 100           # 锁定 ay 零偏前要求的最少 IMU 样本数
  imu_ay_bias_estimator_alpha: 0.15      # 第一段静止窗口内用于 bias 估计的 EMA 系数
  imu_ay_bias_trim_ratio: 0.10           # 对 EMA 后 ay 做 trimmed mean 时两端裁剪比例

# =============================================================================
# 安全退化策略（求解不可行时）
# =============================================================================
safety:
  infeasible_decel: 1.0          # 不可行时制动减速度 (m/s^2)
  infeasible_omega_scale: 0.0    # 不可行时角速度缩放
  infeasible_min_speed: 0.0      # 不可行时线速度下限 (m/s)

# =============================================================================
# 原地对齐模式（航向误差过大时原地转向）
# =============================================================================
heading_align:
  enable: false
  enter_angle: 1.2         # 进入阈值 (rad) ~69° - 提高以避免直道误触发
  exit_angle: 0.6          # 退出阈值 (rad) ~34°
  omega_gain: 1.5
  max_omega: 0.0           # <=0 使用 vehicle.omega_max
  start_distance: 0.5      # 只在起点附近生效 (m)

# =============================================================================
# 终点恢复（near-goal terminal recovery）
# =============================================================================
terminal_recovery:
  enable: true
  enter_distance: 0.70      # 进入近终点恢复区的距离阈值 (m)
  release_distance: 1.00    # 明显离开近终点区后才释放 recovery 锁存 (m)
  goal_behind_x: -0.05      # goal 落到车后时的 x 阈值 (m)
  align_angle: 1.0          # bearing 过大时先原地转向 (rad)
  approach_slow_angle: 0.45 # bearing 偏大时降低前进速度 (rad)
  bearing_gain: 1.8         # 朝向 goal 点的角速度增益
  final_yaw_gain: 1.5       # 最终朝向补偿增益
  max_omega: 0.8            # 终点恢复阶段角速度上限；<=0 用 vehicle.omega_max
  dist_gain: 0.8            # 靠近终点的位置误差到速度的比例增益
  v_min: 0.05               # 终点恢复阶段最小前进速度 (m/s)
  v_max: 0.18               # 终点恢复阶段最大前进速度 (m/s)

# =============================================================================
# 终点残余晃动收敛（T2 settling）
# =============================================================================
settling:
  enable: false             # 实物未完成 T2 settling 验证前默认关闭；仿真使用 mpc_params_sim.yaml
  timeout_s: 3.0            # 最长停留时间，超时后强制 REACHED
  release_distance: 0.45    # 若离开 goal pose 且距离大于此值，则退回 TRACKING
  eta_tol: 0.0015           # |eta_x|/|eta_y| 收敛阈值 (m)
  eta_dot_tol: 0.03         # |eta_dot| 收敛阈值 (m/s)
  speed_tol: 0.05           # 线速度收敛阈值 (m/s)
  omega_tol: 0.10           # 角速度收敛阈值 (rad/s)
  required_steps: 0         # <=0 时按 ceil(4π / ω0 / dt) 自动计算
  Q_v: 30.0                 # SETTLING 期间速度收敛权重
  Q_eta: 10.0               # SETTLING 期间晃动惩罚权重
  eta_bar: 0.04             # SETTLING 期间液面约束上界 (m)

# =============================================================================
# cmd_vel 低通滤波（EMA）
# =============================================================================
filter:
  alpha_v: 1.0             # 线速度滤波系数 (0,1]，越大响应越快
  alpha_omega: 1.0         # 角速度滤波基础系数 (0,1]
  kappa_boost: 0.0         # 曲率自适应增益: alpha_eff = min(1, alpha + boost*|ω|)

# =============================================================================
# slosh-aware 速度治理（阶段 4）
# =============================================================================
slosh_speed_governor:
  enable: false            # 根据当前残余晃动降低参考速度
  k_eta: 2.5               # 液面高度比例缩放系数（配合 eta_deadband）
  ay_max_base: 0.0         # 横向加速度预算；<=0 时回退到 path_handler/max_lat_accel
  v_des_min: 0.0           # 调速后的最低参考速度
  eta_deadband: 0.3        # 低于此液面比例不干预
  eta_exit_ratio: 0.2      # 退出阈值（滞回），低于此比例才释放 governor
  preview_distance: 1.0    # 前方曲率预览长度 (m)
  min_active_steps: 10     # 最少保持周期数，避免阈值附近抖动

# =============================================================================
# 安全/速度保护参数（safety）
#   不在 yaml 里写时均使用代码默认值，建议显式写出便于排查
# =============================================================================
safety:
  tracking_curvature_preview_distance: 0.8      # 曲率预览长度 (m)；默认1.5，v(s)后向DP已覆盖减速，预览只做最后保护
  tracking_curvature_rate_preview_distance: 0.6 # dkappa 预览长度 (m)；默认1.0，同理缩短
  tracking_curvature_min_speed: 0.25            # 曲率限速下限 (m/s)
  tracking_reentry_v_cap: 0.8                   # 重入TRACKING初始速度上限 (m/s)；默认0.6，适当放宽
  tracking_reentry_ramp_steps: 5                # 重入爬坡步数；默认10步(0.5s)，缩短到5步

# =============================================================================
# ρ_k 风险自适应调度器
#   统一调度 Q_eta、η̄、v_ref_eff 三个 QP 参数
#   enable: false → 所有参数固定为 yaml 中的静态值（zero risk scheduling）
# =============================================================================
risk_scheduler:
  enable: false              # 启用风险调度器（Day 2 实现后改为 true）

  # sigmoid 参数：s_ρ = sigmoid(γ*(ρ_k - ρ_0))
  gamma: 5.0                 # sigmoid 斜率
  rho_0: 0.3                 # sigmoid 中点（低于此值不显著干预）

  # 变化率限制（每控制周期最大变化量占满量程的比例，防 QP 参数突变）
  rate_limit_per_step: 0.05  # 5%/步

  # Q_eta 调度范围
  Q_eta_min: 0.0             # 低风险时 Q_slosh（无惩罚）
  Q_eta_max: 10.0            # 高风险时 Q_slosh（强惩罚）

  # η̄ 调度范围（单位：m，对应液面高度；内部换算为模态位移）
  eta_bar_max: 0.05          # 低风险时软约束上限（应与 mpc/slosh_height_max 一致）
  delta_eta_bar: 0.02        # 高风险时收紧量（eta_bar_min = eta_bar_max - delta_eta_bar）

  # v_ref 折扣（高风险时降速）
  beta: 0.3                  # 最大折扣比例（v_eff = v_ref * (1 - beta * s_rho)）

  # 物理风险 r_k 权重（三分量加权和）
  w_h: 0.4                   # 液面预测风险（h_pred_max_prev / eta_bar_max）
  w_e: 0.3                   # 模态能量风险（eta_x² + eta_y²）
  w_t: 0.3                   # 终点接近度（d_goal < d_goal_thresh 时增大）

  # ρ_k 合成权重
  w_r: 0.7                   # 物理风险 r_k 权重
  w_u: 0.3                   # 激励不确定性 u_k 权重

  # fallback 触发条件
  u_threshold_high: 0.8      # u_k 高于此阈值视为异常
  u_high_count_trigger: 10   # 连续 N 步 u_k 异常则触发 fallback
  imu_timeout_s: 0.1         # IMU 最近消息超过此时间触发 fallback (s)
  a_uncert_max: 0.5          # u_k 归一化分母：|a_y_imu - v*ω| / a_uncert_max (m/s²)

  # fallback 固定参数（fallback 期间使用，独立于调度输出）
  Q_eta_fix: 5.0             # fallback 固定 Q_slosh
  eta_bar_fix: 0.04          # fallback 固定 η̄ (m)

  # 终点接近度风险参数
  d_goal_thresh: 1.0         # 距终点小于此距离开始计算 t_risk (m)
