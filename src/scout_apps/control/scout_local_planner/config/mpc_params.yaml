# Scout Mini MPC 局部规划器参数（实物）

# =============================================================================
# MPC 参数
# =============================================================================
mpc:
  # 预测参数
  N: 60                    # 预测步长；30 Hz 下保持约 2.0 s horizon
  dt: 0.0333333333          # 时间步长 (s)，与 30 Hz 控制周期对齐
  cmd_vel_lead_time: -1.0   # 输出速度前瞻时间；<0 沿用 0.5*dt，实物保持旧策略
  
  # 状态权重（Frenet 误差）
  # 注：change #11 修复了 OSQP P 矩阵 2x 系数，此处权重值已做相应调整
  Q_el: 0.5                # 纵向误差权重（沿路径方向）
  Q_ec: 36.0               # 横向误差权重（更贴路径）
  Q_etheta: 15           # 航向误差权重 - 减少直线摇摆
  Q_v: 9.0                 # 速度跟踪权重（修复后 v_ref 目标正确）
  use_contour_lag: true    # 启用 contour + lag 误差结构
  Q_contour: 32.0          # contour（横向误差）权重
  Q_lag: 0.5               # lag（纵向误差）权重
  enable_omega_ff: true    # 启用角速度前馈
  Q_omega_ff: 2.5          # 角速度前馈权重（修复后 omega_ref 目标正确）
  terminal_factor_ec: 5.0
  terminal_factor_etheta: 3.0  # 提高终端航向权重
  terminal_factor_v: 2.0
  terminal_ramp_steps: 5       # 渐进式终端权重：最后 5 步线性递增
  
  # 控制权重
  R_a: 0.4                 # 加速度权重
  R_omega: 2.0             # 角速度权重
  
  # 控制变化率权重（平滑控制）
  R_da: 0.5                # 加速度变化权重——配合 jerk 约束提高
  R_domega: 4.0            # 角速度变化权重 - 再小步降低，改善弯道转向建立

  # 控制变化率约束（硬约束）
  constrain_omega_rate: true
  constrain_accel_rate: true
  
  # 液体晃动权重（归一化模态残余能量）
  Q_slosh: 0.0             # 归一化晃动风险权重；设为 0 表示不启用晃动抑制
  slosh_height_ref: 0.005  # 参考晃动高度 (m)，5 mm；Q_slosh 惩罚 (h/h_ref)^2
  slosh_eta_dot_ratio: 0.3 # eta_dot 等效位移项比例；<=0 时使用手动 Q_slosh_eta_dot
  slosh_preview_factor: 0.0 # one-step preview 额外权重；0=关闭，1=对 x_1..x_N 额外加一份 slosh 权重
  Q_slosh_eta_dot: 0.0     # 兼容旧配置：slosh_eta_dot_ratio<=0 时作为直接 QP 权重
  terminal_factor_slosh_eta: 0.0      # P2: terminal η 代价放大系数，0=关闭；需 Q_slosh>0 才生效
  terminal_factor_slosh_eta_dot: 0.0  # P2: terminal η̇ 代价放大系数，0=关闭；需 Q_slosh_eta_dot>0 才生效
  slosh_height_max: 0.05   # 诊断用模型高度阈值 (m)，不作为 QP 约束

# =============================================================================
# 车辆参数（Scout Mini）
# =============================================================================
vehicle:
  # 速度约束
  v_max: 3.0               # 最大线速度 (m/s) - 实物保守，降低以减少刹车时打滑
  v_min: 0.0               # 最小线速度 (m/s)，禁用倒车
  omega_max: 1.5           # 最大角速度 (rad/s) QP硬约束；1.0→1.5（原1.0因定位漂移保守，可回退）
  
  # 加速度约束
  a_max: 2.0               # 最大线加速度 (m/s²) - 提高以增强加减速能力
  alpha_max: 5.0           # 最大角加速度 (rad/s²) - 降低以平滑转向
  j_max: 4.0               # 最大线加加速度 (m/s^3)——提高以减少加减速响应滞后
  
  # 车辆几何
  track_width: 0.456       # Scout Mini 轮距 (m)
  wheelbase: 0.0           # 差速轮设为 0

# =============================================================================
# 路径处理参数
# =============================================================================
path_handler:
  lookahead_distance: 0.50  # 前视距离 (m) - 继续小步下调，减轻实物切弯/抄近路
  goal_tolerance: 0.20     # 到达目标位置容差 (m) - 实物放宽
  yaw_tolerance: 0.2       # 到达目标航向容差 (rad) - 进一步放宽
  goal_reached_max_speed: 0.08  # 仅在低速时允许切到 REACHED，避免高速判到达后惯性冲过头
  goal_reached_max_omega: 0.15  # 仅在低角速度时允许切到 REACHED
  goal_capture_distance: 0.25   # 终点捕获区；进入后维持最低参考速度，避免提前停死
  goal_capture_min_speed: 0.00  # 捕获区最低参考速度 (m/s)
  path_timeout: 5.0        # 路径超时时间 (s)
  publish_smoothed_path: true         # 是否发布平滑路径
  smoothed_path_topic: "/scout/global_path_smooth"  # 平滑路径话题名
  smoothed_path_points: 80            # 平滑路径采样点数
  window_back: 4                      # 样条窗口向后点数
  window_forward: 48                   # 样条窗口向前额外点数
  s_jump_threshold: 0.8               # 弧长跳变阈值 (m) - 增大以容忍定位抖动
  resample_spacing: 0.05              # 路径重采样间隔 (m)
  max_lat_accel: 2.0                  # 最大横向加速度 (m/s^2)
  speed_profile_omega_max: 1.5        # 规划层角速度上限（与 vehicle/omega_max 一致）；显式配置避免自动桥接后难以排查
  speed_profile_alpha_max: 5.0        # 规划层角加速度上限（与 vehicle/alpha_max 一致）；显式配置避免桥接值隐式变化
  min_ref_speed: 0.0                  # 参考速度下限 (m/s)
  time_parameterize: true             # 启用时间化速度规划 v(s)
  speed_profile_ds: 0.05              # 速度曲线采样间隔 (m)
  external_speed_profile_csv: ""      # 外部 v_ref(s) CSV；空字符串保持内部速度剖面
  max_tan_accel: 2.0                  # 最大切向加速度 (m/s^2) - 提高以加快速度建立
  max_tan_decel: 1.0                  # 最大切向减速度 (m/s^2) - 提高以增强制动收敛
  goal_speed: 0.0                     # 末端期望速度 (m/s)
  use_bspline_smoothing: false        # 关闭局部 B-spline 平滑（提高贴合度）
  bspline_samples_per_segment: 12      # 每段采样点数
  path_change_threshold: 0.3           # 路径相似性阈值 (m)，低于此值视为重复路径，跳过重置

# =============================================================================
# 节点参数
# =============================================================================
control_rate: 30.0         # 控制频率 (Hz)——30 Hz 与 RealSense RGB 和 MPC dt 对齐
base_frame: "base_link"    # 机器人坐标系
map_frame: "map"           # 地图坐标系
verbose: false             # 是否输出调试信息

# =============================================================================
# 执行层速度参考变化率限制（治理纵向 ax 脉冲）
# =============================================================================
v_des_rate_limit:
  enable: true              # slosh 主实验默认开启，避免 v_des_cmd 突跳直接进入 horizon
  accel_limit: 0.60         # v_des 上升变化率上限 (m/s^2)
  decel_limit: 0.80         # v_des 下降变化率上限 (m/s^2)；过低会增加终点滑行风险

# =============================================================================
# 液体晃动模型参数（P0-A: 状态注入）
# =============================================================================
slosh:
  container_radius: 0.0185   # 37 mm 试管内半径 (m)
  liquid_height: 0.058       # 当前试管液面高度 (m)
  liquid_density: 1000.0     # 液体密度 (kg/m³)
  damping_ratio: 0.05        # 37 mm 水试管采集阶段初始阻尼比
  mode_index: 1              # 晃动模态阶数
  offset_x: 0.0              # 容器相对 base_link X 偏移 (m)
  offset_y: 0.0              # 容器相对 base_link Y 偏移 (m)
  use_parabola_term: true    # 是否使用抛物面修正
  use_linear_model: true     # 使用线性模型

# =============================================================================
# 加速度估计 EMA 滤波
# =============================================================================
slosh_estimator:
  accel_filter_alpha: 0.3    # EMA 滤波系数 (0,1]，越小越平滑
  use_imu_lateral_accel: false  # 是否使用 IMU 横向加速度替代 v*omega
  use_imu_yaw_rate: true        # 当前默认安全配置：使用 IMU 角速度 z 替代 odom omega
  use_imu_alpha_z: false        # 是否使用 IMU 角速度差分得到 alpha_z
  imu_topic: /imu/data          # IMU 话题
  imu_filter_alpha: 0.3         # IMU 数据 EMA 滤波系数
  imu_ay_bias_compensation_enable: true  # 阶段 3：是否对 IMU ay 做静止零偏扣除
  imu_ay_bias_init_duration: 3.0         # 估计 ay 零偏所需的连续静止时长 (s)
  imu_ay_bias_static_v_max: 0.03         # 判定静止的最大 |v| (m/s)
  imu_ay_bias_static_omega_max: 0.03     # 判定静止的最大 |omega| (rad/s)
  imu_ay_bias_min_samples: 100           # 锁定 ay 零偏前要求的最少 IMU 样本数
  imu_ay_bias_estimator_alpha: 0.15      # 第一段静止窗口内用于 bias 估计的 EMA 系数
  imu_ay_bias_trim_ratio: 0.10           # 对 EMA 后 ay 做 trimmed mean 时两端裁剪比例

# =============================================================================
# 安全退化策略 + 速度保护（safety）
#   infeasible_*：求解不可行时的退化行为
#   tracking_feasibility_*：TRACKING solve fail 后的恢复限速保护
# =============================================================================
safety:
  infeasible_decel: 1.0          # 不可行时制动减速度 (m/s^2)
  infeasible_omega_scale: 0.0    # 不可行时角速度缩放
  infeasible_min_speed: 0.0      # 不可行时线速度下限 (m/s)
  tracking_feasibility_guard_enable: true      # TRACKING solve fail 后的恢复限速保护
  tracking_reentry_v_cap: 0.8                   # 重入TRACKING初始速度上限 (m/s)；默认0.6，适当放宽
  tracking_reentry_ramp_steps: 5                # 重入爬坡步数；默认10步(0.5s)，缩短到5步

# =============================================================================
# 终点前平滑减速
# =============================================================================
terminal_slowdown:
  enable: true              # 在终点捕获前提前连续压低 v_des_cmd；PathHandler 末端速度验证干净前保留
  distance: 1.20            # 从该距离开始 smoothstep 降速 (m)
  v_max: 0.18               # terminal slowdown 外层包络最高速度 (m/s)
  Q_v: 40.0                 # 制动速度上限生效时临时提高速度跟踪权重
  terminal_factor_v: 5.0    # 制动段临时提高 horizon 末端速度权重

terminal_capture_stop:
  enable: true              # mpc_planner 风格外层终点捕获；阈值内进入限速 CAPTURE_BRAKE
  distance: 0.70            # 终点捕获制动半径 (m)，不参与 slosh 主效果窗口
  v_cap: 0.18               # capture 入口和 capture 内的低速目标上限 (m/s)
  goal_behind_x: -0.05      # goal 落到车后时保持 terminal stop 的 x 阈值 (m)

# =============================================================================
# cmd_vel 低通滤波（EMA）
# =============================================================================
filter:
  alpha_v: 1.0             # 线速度滤波系数 (0,1]，越大响应越快
  alpha_omega: 1.0         # 角速度滤波基础系数 (0,1]
  kappa_boost: 0.0         # 曲率自适应增益: alpha_eff = min(1, alpha + boost*|ω|)
