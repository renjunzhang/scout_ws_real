# Scout 局部规划器配置 (MPC + 液体晃动抑制)

# ==================== 液体晃动模型参数 ====================
slosh:
  enabled: true                   # 是否启用液体晃动建模

  # 容器几何参数 (必须根据实物测量)
  container_radius: 0.15          # 容器内半径 R [m]
  liquid_height: 0.20             # 液体静液高度 h [m]
  liquid_density: 1000.0          # 液体密度 [kg/m^3] (水=1000)

  # 模态参数
  mode_index: 1                   # 模态阶数 (1=主模态)
  damping_ratio: 0.05             # 阻尼比

  # 旋转修正
  offset_x: 0.0                   # 容器偏心距 x [m]
  offset_y: 0.0                   # 容器偏心距 y [m]

  # 物理常量
  gravity: 9.81
  dt: 0.05
  use_linear_model: true
  use_parabola_term: true

# ==================== MPC 参数 ====================
mpc:
  dt: 0.05                        # 采样周期 [s]
  horizon: 15                     # 预测步数

  # 权重
  q_pos: 10.0                     # 位置误差权重
  r_vel: 0.2                      # 速度输出权重
  s_delta: 0.05                   # 速度增量权重

  # 速度限制
  max_speed: 0.5                  # 最大速度 [m/s]
  min_speed: 0.0                  # 最小速度 [m/s]

  # 液体晃动约束
  enable_slosh: true              # 是否启用晃动约束
  q_slosh: 10.0                   # 晃动惩罚权重
  max_slosh_height: 0.05          # 最大晃动高度 [m]

# ==================== 规划器参数 ====================
base_frame: base_link
odom_frame: odom
map_frame: map
goal_tolerance: 0.1               # 目标容差 [m]
lookahead_distance: 1.0           # 前视距离 [m]
control_rate: 20.0                # 控制频率 [Hz]
