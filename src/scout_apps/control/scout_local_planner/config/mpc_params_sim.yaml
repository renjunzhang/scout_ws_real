# Scout Mini MPC 局部规划器参数

# =============================================================================
# MPC 参数
# =============================================================================
mpc:
  # 预测参数
  N: 40                    # 预测步长
  dt: 0.05                  # 时间步长 (s)
  
  # 状态权重（Frenet 误差）
  # 注：change #11 修复了 OSQP P 矩阵 2x 系数，此处权重值已做相应调整
  Q_el: 0.5                # 纵向误差权重（沿路径方向）
  Q_ec: 30.0               # 横向误差权重（更贴路径）
  Q_etheta: 6.0            # 航向误差权重（更贴路径）
  Q_v: 8.0                 # 速度跟踪权重（修复后 v_ref 目标正确）
  use_contour_lag: true    # 启用 contour + lag 误差结构
  Q_contour: 15.0          # contour（横向误差）权重
  Q_lag: 0.5               # lag（纵向误差）权重
  enable_omega_ff: true    # 启用角速度前馈
  Q_omega_ff: 1.5          # 角速度前馈权重（修复后 omega_ref 目标正确）
  terminal_factor_ec: 5.0
  terminal_factor_etheta: 2.0
  terminal_factor_v: 2.0
  terminal_ramp_steps: 5       # 渐进式终端权重：最后 5 步线性递增
  
  # 控制权重
  R_a: 0.4                 # 加速度权重
  R_omega: 0.25            # 角速度权重（直接控制）
  
  # 控制变化率权重（平滑控制）
  R_da: 0.5                # 加速度变化权重——配合 jerk 约束提高
  R_domega: 1.0            # 角速度变化权重

  # 控制变化率约束（硬约束）
  constrain_omega_rate: true
  constrain_accel_rate: true
  
  # 液体晃动权重（第 2 步启用）
  Q_slosh: 0.0             # 设为 0 表示不启用晃动抑制
  slosh_height_max: 0.05   # 液面高度约束 (m)
  enable_slosh_box_constraint: false  # 第一版盒约束代理（ETA_X/ETA_Y），默认关闭

# =============================================================================
# 车辆参数（Scout Mini）
# =============================================================================
vehicle:
  # 速度约束
  v_max: 2.0               # 最大线速度 (m/s)
  v_min: 0.0               # 最小线速度 (m/s)，禁用倒车
  omega_max: 3.5           # 最大角速度 (rad/s)
  
  # 加速度约束
  a_max: 2.0               # 最大线加速度 (m/s²)
  alpha_max: 7.0           # 最大角加速度 (rad/s²)
  j_max: 3.0               # 最大线加加速度 (m/s^3)——jerk 约束
  
  # 车辆几何
  track_width: 0.456       # Scout Mini 轮距 (m)
  wheelbase: 0.0           # 差速轮设为 0

# =============================================================================
# 路径处理参数
# =============================================================================
path_handler:
  lookahead_distance: 0.6  # 前视距离 (m)
  goal_tolerance: 0.1      # 到达目标位置容差 (m)
  yaw_tolerance: 0.1       # 到达目标航向容差 (rad)
  goal_reached_max_speed: 0.08  # 仅在低速时允许切到 REACHED
  goal_reached_max_omega: 0.15  # 仅在低角速度时允许切到 REACHED
  goal_capture_distance: 0.45   # 终点捕获区；进入后维持最低参考速度，避免提前停死
  goal_capture_min_speed: 0.10  # 捕获区最低参考速度 (m/s)
  path_timeout: 5.0        # 路径超时时间 (s)
  publish_smoothed_path: true         # 是否发布平滑路径
  smoothed_path_topic: "/scout/global_path_smooth"  # 平滑路径话题名
  smoothed_path_points: 80            # 平滑路径采样点数
  window_back: 4                      # 样条窗口向后点数
  window_forward: 48                   # 样条窗口向前额外点数
  s_jump_threshold: 0.5               # 弧长跳变阈值 (m)
  resample_spacing: 0.05              # 路径重采样间隔 (m)
  max_lat_accel: 2.0                  # 最大横向加速度 (m/s^2)
  min_ref_speed: 0.0                  # 参考速度下限 (m/s)
  time_parameterize: true             # 启用时间化速度规划 v(s)
  speed_profile_ds: 0.05              # 速度曲线采样间隔 (m)
  max_tan_accel: 2.0                  # 最大切向加速度 (m/s^2) <= a_max
  max_tan_decel: 2.0                  # 最大切向减速度 (m/s^2) <= a_max
  goal_speed: 0.0                     # 末端期望速度 (m/s)
  use_bspline_smoothing: true         # 启用局部 B-spline 平滑
  bspline_samples_per_segment: 12      # 每段采样点数
  path_change_threshold: 0.3           # 路径相似性阈值 (m)，低于此值视为重复路径，跳过重置

# =============================================================================
# 节点参数
# =============================================================================
control_rate: 20.0         # 控制频率 (Hz)——20 Hz 与 MPC dt=0.05 对齐
base_frame: "base_link"    # 机器人坐标系
map_frame: "map"           # 地图坐标系
verbose: false             # 是否输出调试信息

# =============================================================================
# 液体晃动模型参数（P0-A: 状态注入）
# =============================================================================
slosh:
  container_radius: 0.15     # 容器半径 (m)
  liquid_height: 0.20        # 液面高度 (m)
  liquid_density: 1000.0     # 液体密度 (kg/m³)
  damping_ratio: 0.05        # 阻尼比
  mode_index: 1              # 晃动模态阶数
  offset_x: 0.0              # 容器相对 base_link X 偏移 (m)
  offset_y: 0.0              # 容器相对 base_link Y 偏移 (m)
  use_parabola_term: true    # 是否使用抛物面修正
  use_linear_model: true     # 使用线性模型

# =============================================================================
# 加速度估计 EMA 滤波
# =============================================================================
slosh_estimator:
  accel_filter_alpha: 0.3    # EMA 滤波系数 (0,1]，越小越平滑
  use_imu_lateral_accel: false  # 是否使用 IMU 横向加速度替代 v*omega
  use_imu_yaw_rate: false       # 是否使用 IMU 角速度 z 替代 odom omega
  use_imu_alpha_z: false        # 是否使用 IMU 角速度差分得到 alpha_z
  imu_topic: /imu/data          # IMU 话题
  imu_filter_alpha: 0.3         # IMU 数据 EMA 滤波系数
  imu_ay_bias_compensation_enable: true  # 阶段 3：是否对 IMU ay 做静止零偏扣除
  imu_ay_bias_init_duration: 3.0         # 估计 ay 零偏所需的连续静止时长 (s)
  imu_ay_bias_static_v_max: 0.03         # 判定静止的最大 |v| (m/s)
  imu_ay_bias_static_omega_max: 0.03     # 判定静止的最大 |omega| (rad/s)
  imu_ay_bias_min_samples: 100           # 锁定 ay 零偏前要求的最少 IMU 样本数
  imu_ay_bias_estimator_alpha: 0.15      # 第一段静止窗口内用于 bias 估计的 EMA 系数
  imu_ay_bias_trim_ratio: 0.10           # 对 EMA 后 ay 做 trimmed mean 时两端裁剪比例

# =============================================================================
# 安全退化策略（求解不可行时）
# =============================================================================
safety:
  infeasible_decel: 1.0          # 不可行时制动减速度 (m/s^2)
  infeasible_omega_scale: 0.0    # 不可行时角速度缩放
  infeasible_min_speed: 0.0      # 不可行时线速度下限 (m/s)

# =============================================================================
# 原地对齐模式（航向误差过大时原地转向）
# =============================================================================
heading_align:
  enable: false
  enter_angle: 1.2         # 进入阈值 (rad) ~69° - 提高以避免直道误触发
  exit_angle: 0.6          # 退出阈值 (rad) ~34°
  omega_gain: 1.5
  max_omega: 0.0           # <=0 使用 vehicle.omega_max
  start_distance: 0.5      # 只在起点附近生效 (m)

# =============================================================================
# cmd_vel 低通滤波（EMA）
# =============================================================================
filter:
  alpha_v: 0.3             # 线速度滤波系数 (0,1]，越大响应越快
  alpha_omega: 0.4         # 角速度滤波基础系数 (0,1]
  kappa_boost: 0.5         # 曲率自适应增益: alpha_eff = min(1, alpha + boost*|ω|)

# =============================================================================
# slosh-aware 速度治理（阶段 4）
# =============================================================================
slosh_speed_governor:
  enable: false            # 根据当前残余晃动降低参考速度
  k_eta: 2.5               # 液面高度比例缩放系数（配合 eta_deadband）
  ay_max_base: 0.0         # 横向加速度预算；<=0 时回退到 path_handler/max_lat_accel
  v_des_min: 0.0           # 调速后的最低参考速度
  eta_deadband: 0.3        # 低于此液面比例不干预
  eta_exit_ratio: 0.2      # 退出阈值（滞回），低于此比例才释放 governor
  preview_distance: 1.0    # 前方曲率预览长度 (m)
  min_active_steps: 10     # 最少保持周期数，避免阈值附近抖动
