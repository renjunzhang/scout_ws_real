variants:
  B0:
    slosh_enable: false
    smooth_priority_enable: false
    slosh_constraint_enable: false
    w_contour: 1.0
    w_lag: 0.2
    w_progress: 0.2
    w_control: 0.1
    w_smooth: 0.1
    w_slosh: 0.0

  B_slosh:
    slosh_enable: true
    smooth_priority_enable: false
    slosh_constraint_enable: false
    w_contour: 1.0
    w_lag: 0.2
    w_progress: 0.2
    w_control: 0.1
    w_smooth: 0.1
    w_slosh: 5.0   # bug A 修复后 slosh 与 contour 同量级; 调到 5 让 slosh 能改变候选选择 (后续可 sweep)

  B_smooth:
    slosh_enable: false
    smooth_priority_enable: true
    slosh_constraint_enable: false
    w_contour: 1.0
    w_lag: 0.2
    w_progress: 0.2
    w_control: 0.3
    w_smooth: 1.0
    w_slosh: 0.0

  B_ours:
    slosh_enable: true
    smooth_priority_enable: true
    slosh_constraint_enable: false
    w_contour: 1.0
    w_lag: 0.2
    w_progress: 0.2
    w_control: 0.3
    w_smooth: 1.0
    w_slosh: 5.0   # 与 B_slosh 一致, 叠加强 smooth
