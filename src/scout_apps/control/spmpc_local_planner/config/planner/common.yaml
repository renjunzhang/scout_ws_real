control_frequency: 30.0
dt: 0.0333333333
horizon_steps: 60
publish_cmd_vel: true

# solver 后端:
#   continuous_mpcc_acados: SPMPC 主线 continuous MPCC
#   continuous_mpcc_direct_omega_legacy: RouteB diagnostic/legacy continuous MPCC
#   primitive: fallback/debug rollout sampling + cost ranking, not MPCC/mainline
solver_backend: continuous_mpcc_acados

topics:
  odom: /odom
  reference_path: /scout/global_path_fixed
  costmap: /map
  cmd_vel: /cmd_vel

frames:
  robot_base: base_link
  use_tf_pose: true
  tf_timeout_sec: 0.05

reference:
  lookahead_distance: 0.6
  preprocess_enable: false
  resample_spacing: 0.08
  smoothing_window: 3
  min_segment_length: 0.001

terminal:
  enable: true
  goal_tolerance: 0.20   # 与 TEB/DWA 统一成功判定距离(原 0.15)
  goal_reached_max_speed: 0.03
  goal_reached_max_omega: 0.05
  slowdown:
    enable: true
    distance: 1.20
    v_max: 0.18
  capture_stop:
    enable: true
    distance: 0.70
    v_cap: 0.18
    goal_behind_x: -0.05
  command_clamp:
    enable: true
    rate_limit_enable: true
    omega_enable: true
    omega_max: 0.25
    omega_near_goal_max: 0.10
    omega_near_goal_distance: 0.35
  spin_fail:
    enable: true
    omega_threshold: 0.20
    max_duration_sec: 2.0

tracking_safety:
  enable: true
  projection:
    enable: true
    max_distance_m: 0.50
    max_duration_sec: 0.20
  spin_fail:
    enable: true
    omega_threshold: 0.50
    max_duration_sec: 2.0

# Detector-only near-start lock observability. Disabled by default; it does not override /cmd_vel.
start_lock_recovery:
  enable: false
  detect_only: true
  start_window_s: 0.20
  min_stall_duration_sec: 1.50
  progress_epsilon_s: 0.005
  cmd_v_small_threshold: 0.03
  warm_start_v_s_min: 0.10
  u0_v_s_max: 0.02
  require_monotonic_clip: true
  max_projection_distance_m: 0.50

platform:
  kinematics: differential

acados:
  warm_start:
    enable: true                          # 2026-06-08: 开热启动, 让弯处卡死的 OCP 从"在动"的猜测重启
    type: diff_drive_flatness
    use_previous_solution: true
    use_slosh_rollout: true
    curvature_speed_limit_enable: true
    max_reference_fit_error: 0.10
    fallback_to_previous_solution: false  # 关键: 卡死时"上周期解"=停滞轨迹, 拿它当热启动等于又喂回卡死, 必须关
    fallback_to_primitive: true           # 回退到保守"在动"猜测(v_seed + omega=kappa*v)
  warm_start_flatness_enable: false
