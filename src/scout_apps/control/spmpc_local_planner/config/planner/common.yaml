control_frequency: 30.0
dt: 0.0333333333
horizon_steps: 60
publish_cmd_vel: true

# solver 后端: primitive | continuous_mpcc_acados
solver_backend: primitive

topics:
  odom: /odom
  reference_path: /scout/global_path_fixed
  costmap: /map
  cmd_vel: /cmd_vel

frames:
  robot_base: base_link
  use_tf_pose: true
  tf_timeout_sec: 0.05

reference:
  lookahead_distance: 0.6

terminal:
  goal_tolerance: 0.15
