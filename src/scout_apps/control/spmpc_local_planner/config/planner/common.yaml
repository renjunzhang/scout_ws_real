control_frequency: 30.0
dt: 0.0333333333
horizon_steps: 60
publish_cmd_vel: true

# solver 后端:
#   continuous_mpcc_acados: SPMPC 主线 continuous MPCC
#   continuous_mpcc_direct_omega_legacy: RouteB diagnostic/legacy continuous MPCC
#   primitive: fallback/debug rollout sampling + cost ranking, not MPCC/mainline
solver_backend: continuous_mpcc_acados

topics:
  odom: /odom
  imu: /imu/data
  reference_path: /scout/global_path_fixed
  costmap: /map
  cmd_vel: /cmd_vel

frames:
  robot_base: base_link
  use_tf_pose: true
  tf_timeout_sec: 0.05

# The default release remains odom. processed_imu can only enter the liquid
# state through an explicit source setting plus READY/freshness admission.
# A runtime IMU failure falls back to odom and latches for the rest of the node
# lifetime by default; the typed selection diagnostic makes that trial visible.
slosh_observer:
  source: odom                 # odom | processed_imu
  fallback_policy: odom       # odom | fail_closed
  latch_fallback: true
  max_imu_state_age_sec: 0.10
  max_odom_state_age_sec: 0.50
  max_future_skew_sec: 0.005

# Processed-IMU pipeline and optional parallel observer. The legacy
# imu_shadow/enable name is retained for compatibility; when source is
# processed_imu the node forces this pipeline on and treats configuration
# failure as fatal.
# The gyro-z affine correction and approximate +15 ms sensor delay below come
# from the 20260729 mocap/IMU run.  The filter cutoffs/phase delays are software
# design values; accel scale and the full six-axis extrinsic remain uncalibrated.
# The 0629 red_3ruler file calibrates RGB liquid height only and is not reused.
# Tracker0-to-base yaw is a mocap-frame correction, not an IMU-axis correction,
# and is therefore not applied a second time to online IMU samples.
# The planar lever arm is the inverse of the nominal base_link-to-imu_link XY
# translation, with the target provisionally placed at a base/ICR proxy.  It is
# not identified from Tracker0 translation and is not a calibrated full extrinsic.
imu_shadow:
  enable: false
  publish_diagnostics: true
  expected_frame: imu_link
  # Keep enough callback backlog for short diagnostic-publication stalls.  A
  # queue of one dropped a real 50 Hz sample in G3 Row 08 and falsely opened a
  # new processed-IMU epoch even though /imu/data itself was complete.
  subscriber_queue_size: 10
  # Nominal cached discretization; accepted updates use their exact header dt.
  observer_dt_sec: 0.020

  gravity_mps2: 9.8
  sensor_delay_sec: 0.015  # approximate measured lag; uncertainty is about +/-0.020 s
  accel_cutoff_hz: 10.0
  gyro_cutoff_hz: 12.0
  accel_phase_delay_sec: 0.006834
  gyro_phase_delay_sec: 0.005020
  alpha_phase_delay_sec: 0.015001

  gyro_scale: 1.001773
  gyro_offset_radps: -0.000297
  imu_to_base_yaw_rad: 0.0  # nominal development choice; installation yaw is not calibrated
  lever_arm_imu_to_target_x_m: -0.100
  lever_arm_imu_to_target_y_m: 0.045

  bias_window_start_sec: 2.0
  bias_window_end_sec: 10.0
  bias_min_samples: 100
  bias_max_accel_mad_mps2: 0.02
  bias_max_gyro_p95_radps: 0.03
  # Contract: keep the robot still through [2,10)s.  A failed bias check stays
  # fail-closed across packet gaps; restart/reset only after restoring stillness.

  filter_warmup_sec: 0.20
  # Nominal input is 50 Hz.  The formal 0705 set contains one observed
  # 31.059 ms interval, so >35 ms is treated as a dropped-sample epoch break.
  max_sample_gap_sec: 0.035
  clock_reset_threshold_sec: 0.50
  max_receive_age_sec: 0.10
  max_future_skew_sec: 0.005
  quaternion_norm_min: 0.95
  quaternion_norm_max: 1.05

reference:
  lookahead_distance: 0.6
  preprocess_enable: false
  resample_spacing: 0.08
  smoothing_window: 3
  min_segment_length: 0.001

terminal:
  enable: true
  goal_tolerance: 0.20   # 与 TEB/DWA 统一成功判定距离(原 0.15)
  goal_reached_max_speed: 0.03
  goal_reached_max_omega: 0.05
  slowdown:
    enable: true
    distance: 1.20
    v_max: 0.18
  capture_stop:
    enable: true
    distance: 0.70
    v_cap: 0.18
    goal_behind_x: -0.05
  command_clamp:
    enable: true
    rate_limit_enable: true
    omega_enable: true
    omega_max: 0.25
    omega_near_goal_max: 0.10
    omega_near_goal_distance: 0.35
  spin_fail:
    enable: true
    omega_threshold: 0.20
    max_duration_sec: 2.0

tracking_safety:
  enable: true
  projection:
    enable: true
    max_distance_m: 0.50
    max_duration_sec: 0.20
  spin_fail:
    enable: true
    omega_threshold: 0.50
    max_duration_sec: 2.0

# Detector-only near-start lock observability. Disabled by default; it does not override /cmd_vel.
start_lock_recovery:
  enable: false
  detect_only: true
  start_window_s: 0.20
  min_stall_duration_sec: 1.50
  progress_epsilon_s: 0.005
  cmd_v_small_threshold: 0.03
  warm_start_v_s_min: 0.10
  u0_v_s_max: 0.02
  require_monotonic_clip: true
  max_projection_distance_m: 0.50

# Soft online reference governor. Disabled by default; when enabled it only caps
# SolverInput.v_ref_current before MPCC solve and never gates /cmd_vel directly.
slosh_risk_governor:
  enable: false
  require_slosh_variant: true
  horizon_steps: 30
  height_limit_m: 0.006
  risk_threshold: 1.0
  release_threshold: 0.75
  beta_min: 0.45
  beta_grid_count: 12
  min_v_ref: 0.05
  accel_limit: 0.4
  omega_decay_tau: 0.5
  beta_rate_up_per_sec: 0.5
  beta_rate_down_per_sec: 2.0
  include_parabola_height: true

# Independent hard linear-speed boundary for real-vehicle diagnostics.
# Disabled by default so historical/formal runners keep their configured
# platform ceiling unless they explicitly opt in.
speed_safety:
  enable: false
  v_safe_max: 0.15
  tolerance: 0.0001

# P0/P1 delay-phase handling. Disabled by default.
# monitor/shadow only publish diagnostics. fixed_closed_loop uses guarded predicted
# execution state as SolverInput and falls back to raw state when guards fail.
delay_phase:
  mode: off              # off | monitor | shadow | fixed_closed_loop | fixed_robot_only
  publish_diagnostics: true
  history_window_sec: 2.0
  cmd_timeout_sec: 0.5
  odom_timeout_sec: 0.5
  linear_delay_sec: 0.15
  angular_delay_sec: 0.22
  max_prediction_sec: 0.40
  max_integration_step_sec: 0.02
  min_integration_step_sec: 0.001
  require_complete_history: false

# Robot pose/twist is reconstructed at the selected liquid observer timestamp
# before a slosh solve.  This removes the 41--57 ms mixed-epoch initial state
# seen in the old G3/G3R2 bags.  Missing history, excessive skew, or a large
# interpolation gap is fail-closed for slosh variants.
state_timing:
  require_common_epoch: true
  max_raw_skew_sec: 0.080
  odom_history_sec: 1.0
  max_interpolation_gap_sec: 0.050
  max_robot_extrapolation_sec: 0.010

# The development matched runner disables redundant post-solver rate limiters
# and enables this gate.  Legacy runners keep the gate audit-only by default.
execution_contract:
  fail_closed_on_post_limit_change: false
  max_post_limit_delta_v: 0.0001
  max_post_limit_delta_omega: 0.0001

platform:
  kinematics: differential

acados:
  warm_start:
    enable: true                          # 2026-06-08: 开热启动, 让弯处卡死的 OCP 从"在动"的猜测重启
    type: diff_drive_flatness
    use_previous_solution: true
    use_slosh_rollout: true
    curvature_speed_limit_enable: true
    max_reference_fit_error: 0.10
    fallback_to_previous_solution: false  # 关键: 卡死时"上周期解"=停滞轨迹, 拿它当热启动等于又喂回卡死, 必须关
    fallback_to_primitive: true           # 回退到保守"在动"猜测(v_seed + omega=kappa*v)
  warm_start_flatness_enable: false
