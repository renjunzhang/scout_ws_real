acados:
  rti_iterations: 3
  rti_min_iterations: 1  # feasible residuals may exit early; full acceptance checks still follow
ablation:
  actual_jerk_max: 1.0  # actuator-output longitudinal jerk at 30 Hz; plan must declare the same bound
planning:
  experiment_profile_id: planned_slosh
  liquid_free_baseline: false
  geometry:
    enabled: true
    curvature_weight: 0.05
    # This term scales as 1 / speed_regularization^3 at rest; keep yaw correction affordable.
    curvature_rate_weight: 0.0001
    # Use terminal.goal_pose_weight only during the existing terminal approach.
    goal_weight: 0.0
    speed_regularization: 0.05
    reference_curvature_speed_limit: false
  region:
    enabled: false
    cells: []
  reference:
    mode: progress
    plan_file: ''
variants:
  B_slosh:
    slosh_enable: true
    slosh_constraint_enable: false
    w_slosh: 5.0
    w_contour: 1.0
    w_lag: 0.2
    w_progress: 0.2
    w_v: 1.0
    w_vs: 0.3
    v_ref: 0.25
    w_control: 0.1
    w_accel: 0.0
    w_smooth: 0.1
    w_alpha: 0.1
    w_du_a: 0.1
    w_du_vs: 0.1
tracking_safety:
  enable: false
