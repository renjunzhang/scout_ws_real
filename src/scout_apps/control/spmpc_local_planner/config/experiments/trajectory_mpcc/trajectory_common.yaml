# Shared task/vehicle contract for every trajectory-MPCC comparison profile.
planning:
  task_deadline_sec: 0.0
  evaluation_window_sec: 1.0
execution_model:
  actual_v_min: -0.002
platform:
  shared_constraints:
    # Acceleration/jerk are enforced inside the common explicit-actuator OCP.
    linear_accel_limit_enable: false
    angular_limit_enable: false
execution_contract:
  fail_closed_on_post_limit_change: true
  # Measured post-RTI dispatch <=1.69 ms; retain margin within the same 30 Hz deadline.
  publish_reserve_sec: 0.003
acados:
  rti_iterations: 5
  qp_iteration_limit: 20  # Bound work per RTI; keep all feasibility/publication checks.
  max_prediction_defect: 0.0001
terminal:
  mpc_stop_handoff_enable: true
  require_goal_yaw: true
  goal_yaw_tolerance: 0.10
  goal_pose_weight: 2.0  # Common terminal approach; independent of geometry ablation.
  complete_stop:
    enable: false
  enable: true
  goal_tolerance: 0.05
  goal_reached_max_speed: 0.01
  goal_reached_max_omega: 0.02
  slowdown: {enable: true, distance: 1.20, v_max: 0.18}
  capture_stop: {enable: true, distance: 0.70, v_cap: 0.18}
ablation:
  zero_liquid_initial_state: false
  jerk_limit_enable: true
  jerk_max: 1.0
