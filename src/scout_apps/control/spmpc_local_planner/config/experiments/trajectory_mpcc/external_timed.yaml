# External offline baselines: ordinary time/pose tracking, no online liquid
# objective or constraint. Uses the production actuator, histories and gates.
planning:
  experiment_profile_id: external_timed
  liquid_free_baseline: false  # This flag specifically identifies raw-path B0.
  geometry:
    enabled: true
    curvature_weight: 0.0
    curvature_rate_weight: 0.0
    goal_weight: 2.0
    speed_regularization: 0.05
    reference_curvature_speed_limit: false
  region:
    enabled: false
    cells: []
  reference:
    mode: time_tracking
    plan_file: ''
variants:
  B0:
    slosh_enable: false
    slosh_constraint_enable: false
    w_slosh: 0.0
    w_contour: 1.0
    w_lag: 0.2
    w_progress: 0.0
    w_v: 10.0
    w_vs: 0.3
    v_ref: 0.25
    w_control: 0.1
    w_accel: 0.0
    w_smooth: 0.1
    w_alpha: 0.1
    w_du_a: 0.1
    w_du_vs: 0.1
slosh:
  recovery:
    enable: false
slosh_risk_governor:
  enable: false
tracking_safety:
  enable: false
