robot:
  v_max: 0.45
  omega_max: 0.75

reference:
  preprocess_enable: true
  resample_spacing: 0.08
  smoothing_window: 3
  min_segment_length: 0.001

terminal:
  enable: true
  goal_tolerance: 0.25
  goal_reached_max_speed: 0.03
  goal_reached_max_omega: 0.05
  slowdown:
    enable: true
    distance: 1.20
    v_max: 0.16
  capture_stop:
    enable: true
    distance: 0.70
    v_cap: 0.16
    goal_behind_x: -0.05
  command_clamp:
    enable: true
    rate_limit_enable: true

acados:
  warm_start:
    enable: true
    type: diff_drive_flatness
    use_previous_solution: true
    use_slosh_rollout: true
    curvature_speed_limit_enable: true
    max_reference_fit_error: 0.10
    fallback_to_previous_solution: true
    fallback_to_primitive: true
  warm_start_flatness_enable: true

variants:
  B_ours:
    w_smooth: 0.25
    w_slosh: 1.0
  B_ours_anti:
    w_smooth: 0.25
    w_slosh: 1.0

experiment:
  mode: point_to_point
  reference_source: global_path
  corridor_width: 0.50
  # 当前默认主线是 continuous_mpcc_acados；corridor/obstacle/homotopy OCP 模块未接入前保持关闭，避免静默误用。
  corridor_enable: false
  corridor_hard_bound_enable: false
  corridor_weight: 1.0
  obstacle_enable: false
  obstacle_weight: 1.0
  # If obstacle cost is enabled in future, use a radius that covers the
  # conservative Scout Mini circumscribed footprint from platforms/scout_mini.yaml.
  obstacle_influence_radius: 0.45
  homotopy_enable: false
  homotopy_lateral_offset: 0.12
