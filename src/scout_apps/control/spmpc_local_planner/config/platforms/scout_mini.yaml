robot:
  v_max: 0.8
  omega_max: 1.2
  a_max: 0.6
  alpha_max: 1.2   # 转向角加速度上限 |d(omega)/dt| (rad/s^2)，与 TEB/DWA acc_lim_theta 对齐

platform:
  shared_constraints:
    linear_accel_limit_enable: true
    linear_accel_max: 0.6
    linear_accel_max_dt: 0.2
    angular_limit_enable: false
    angular_rate_max: 1.2
    angular_accel_max: 1.2
    angular_accel_max_dt: 0.2
