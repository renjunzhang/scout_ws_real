# 液体晃动控制参数配置示例

# ============================================
# 液体晃动建模参数 (Liquid Slosh Modeling)
# ============================================
# 基于论文: "Sloshing Dynamics Estimation for Liquid-filled Containers 
#            under 2-Dimensional Excitation" (ECCOMAS 2021)
#
# 建模原理: 使用等效质量-弹簧-阻尼(MSD)模型近似液体晃动
#          输入: 容器加速度 [ax, ay]
#          输出: 液面晃动高度 η [m]

track_simple:
  # ==================== 液体晃动模型开关 ====================
  slosh:
    enabled: true  # 主开关：是否启用液体晃动建模
    
    # === 容器几何参数 (必须根据实物测量) ===
    container_radius: 0.014     # 试管内半径 R [m]，按直径 28 mm 取值
    liquid_height: 0.055        # 液体静液高度 h [m]，按当前测量约 55 mm 取值
    liquid_density: 1000.0      # 液体密度 ρ [kg/m³]，水
    
    # === 模态参数 ===
    mode_index: 1               # 使用的模态阶数 (1=主模态，频率最低)
                                # 通常只需第一阶模态即可捕获主要晃动
                                # 可选: 2,3,4,5 (高阶模态频率更高，幅值更小)
    
    damping_ratio: 0.12         # 初始阻尼比 ζ (无量纲)
                                # 当前按 28 mm 水试管给出经验初值
                                # 仍需通过自由衰减实验辨识修正
    
    # === 旋转修正参数 ===
    offset_x: 0.0               # 容器相对底盘旋转中心的偏心距 x [m]
    offset_y: 0.0               # 容器相对底盘旋转中心的偏心距 y [m]
                                # 如果容器不在旋转中心，设置非零值
                                # 正值: 容器在旋转中心的正方向
    
    # === 物理常量 ===
    gravity: 9.81               # 重力加速度 [m/s²] (标准地球重力)
    
    # === 输出模型 ===
    use_linear_model: true      # true=线性模型(L), false=非线性模型(NL)
                                # 线性模型更简单，推荐初次使用
                                # 非线性模型在大晃动时更准确
  
  # ==================== MPC 液体晃动约束 ====================
  mpc:
    enabled: true               # MPC 总开关
    
    # === 液体晃动集成 ===
    enable_slosh: true          # 是否在MPC中启用液体晃动约束
                                # 注意: 必须同时启用 slosh/enabled
    
    q_slosh: 10.0               # 液面晃动惩罚权重 (越大越抑制晃动)
                                # 建议范围: 5.0 ~ 50.0
                                # - 低值(5): 轻微抑制，跟踪性能优先
                                # - 中值(10-20): 平衡晃动和跟踪
                                # - 高值(50): 强力抑制晃动，可能牺牲跟踪速度
    
    max_slosh_height: 0.05      # 最大允许液面晃动高度 [m] (软约束)
                                # 超过此值会大幅增加成本函数惩罚
                                # 根据容器高度设置 (建议 < h/4)
    
    # === 其他MPC参数 (保留原有) ===
    dt: 0.05
    horizon_steps: 15
    q_pos: [10.0, 10.0]
    r_vel: [0.2, 0.2]
    s_delta: [0.05, 0.05]       # 速度增量权重 (加速度平滑)
                                # 增大此值也能间接抑制晃动
    max_speed: 0.5
    min_speed: 0.25
    enforce_min_speed: false
    regularization: 1.0e-6
    warm_start: true

# ============================================
# 实验调参指南
# ============================================
#
# 1. 首次使用 - 保守配置:
#    - slosh/enabled: true
#    - mpc/enable_slosh: true
#    - q_slosh: 10.0
#    - damping_ratio: 0.05
#
# 2. 如果晃动仍然明显:
#    - 增大 q_slosh (10 -> 20 -> 50)
#    - 增大 s_delta ([0.05, 0.05] -> [0.1, 0.1])
#    - 降低 max_speed (0.5 -> 0.4)
#
# 3. 如果跟踪性能下降:
#    - 降低 q_slosh (50 -> 20 -> 10)
#    - 增大 q_pos ([10, 10] -> [15, 15])
#
# 4. 参数辨识流程:
#    Step 1: 测量容器几何 (R, h)
#    Step 2: 称重获得液体质量 -> 反推 ρ 或 h
#    Step 3: 运行轨迹，记录 /track_simple/slosh_height 话题
#    Step 4: 观察晃动频率，与理论值对比
#            f_theory = ωn / (2π) [Hz]
#    Step 5: 调整 damping_ratio 使衰减速率匹配
#
# 5. 理论参数速查:
#    模态根 ξ1n: [1.8412, 5.3314, 8.5363, ...]
#    频率公式: ωn² = g·(ξ1n/R)·tanh(ξ1n·h/R)
#    
#    示例 (R=0.15m, h=0.2m, mode=1):
#      ξ11 = 1.8412
#      ωn ≈ 7.5 rad/s
#      f ≈ 1.2 Hz
#
# ============================================
# ROS 话题输出
# ============================================
# /track_simple/slosh_height   [std_msgs/Float64]
#   - 当前液面晃动高度 η [m]
#   - 可用 rqt_plot 实时查看
#
# rviz 可视化:
#   - /track_simple/ref_path       (参考轨迹)
#   - /track_simple/odom_path      (实际轨迹)
#   - /track_simple/mpc_predicted_path (MPC预测)
