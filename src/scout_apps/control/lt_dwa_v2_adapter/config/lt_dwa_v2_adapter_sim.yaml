runtime:
  publish_cmd_vel: false
  publish_shadow_cmd: true
  publish_diagnostics: false
  require_map: true

topics:
  odom_topic: /odom
  map_topic: /map
  global_path_topic: /scout/global_path_fixed
  goal_topic: /scout/goal
  cmd_vel_topic: /lt_dwa_v2/shadow_cmd_vel
  shadow_cmd_topic: /baseline/lt_dwa_v2/shadow_cmd_vel
  status_topic: /baseline/lt_dwa_v2/status
  diagnostics_topic: /baseline/lt_dwa_v2/diagnostics
  global_plan_topic: /baseline/lt_dwa_v2/global_plan
  local_plan_topic: /baseline/lt_dwa_v2/local_plan

frames:
  base_frame: base_link
  plan_target_frame: odom
  tf_timeout_sec: 0.2

timing:
  planning_frequency: 10.0
  command_publish_frequency: 25.0
  command_stale_timeout_sec: 2.0

limits:
  v_max_mps: 0.8
  omega_max_radps: 1.2
  a_max_mps2: 0.6
  alpha_max_radps2: 1.2
  allow_reverse: false

goal:
  xy_tolerance_m: 0.20
  yaw_tolerance_rad: 0.30

tracking:
  max_tracking_deviation_m: 1.50
  lookahead_distance_m: 0.55
  progress_rollback_tolerance_m: 0.35
  max_progress_advance_per_step_m: 0.35
  cross_track_heading_gain: 1.40
  tracking_slowdown_lateral_m: 0.35
  tracking_slowdown_heading_rad: 0.65

rollout:
  dt: 0.15
  horizon_steps: 12

sampling:
  v_samples: 7
  omega_samples: 9

search:
  top_k_per_layer: 80
  deterministic_tie_break: progress_then_cost

occupancy:
  robot_radius_m: 0.35
  clearance_radius_m: 0.80
  lethal_occupancy: 65
  treat_unknown_as_occupied: false

weights:
  obstacle: 2.0
  path_lateral: 4.0
  heading: 2.0
  progress: 3.0
  terminal: 4.0
  smooth_v: 0.0
  smooth_omega: 0.08
  speed: 1.0
