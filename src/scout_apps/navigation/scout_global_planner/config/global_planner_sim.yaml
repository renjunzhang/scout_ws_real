# Scout 全局规划器配置（仿真专用）

# move_base 全局参数
planner_frequency: 1.0
controller_frequency: 5.0
planner_patience: 5.0
controller_patience: 5.0

# 全局代价地图参数
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  transform_tolerance: 0.2
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: true
  rolling_window: false
  resolution: 0.05
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  # 膨胀层
  inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0
    inflation_radius: 0.5

  # 静态层（仿真：将 65+ 代价视为致命障碍，避免路径穿墙）
  static_layer:
    enabled: true
    map_topic: /map
    track_unknown_space: true
    unknown_cost_value: 255
    lethal_cost_threshold: 65

# 局部代价地图参数（move_base 仍需初始化）
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  transform_tolerance: 0.2
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0
    inflation_radius: 0.5

  static_layer:
    enabled: true
    map_topic: /map

# 全局规划器参数
GlobalPlanner:
  # 使用 navfn 或 global_planner
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false

  # 路径平滑
  allow_unknown: false
  planner_window_x: 0.0
  planner_window_y: 0.0
  default_tolerance: 0.0

  # 启发式
  visualize_potential: false

  # 路径规划频率
  planner_frequency: 1.0

# navfn 可选参数（若使用 navfn/NavfnROS）
NavfnROS:
  allow_unknown: false
  use_dijkstra: true
  visualize_potential: false

# DWA（占位）避免 TF 轻微延迟导致 local plan 失败
DWAPlannerROS:
  transform_tolerance: 0.2
