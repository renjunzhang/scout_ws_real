# Scout 全局规划器配置

# 全局代价地图参数
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: true
  rolling_window: false
  resolution: 0.05

  # 膨胀层
  inflation_layer:
    enabled: true
    cost_scaling_factor: 3.0
    inflation_radius: 0.5

  # 静态层
  static_layer:
    enabled: true
    map_topic: /map

# 全局规划器参数
GlobalPlanner:
  # 使用 navfn 或 global_planner
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false

  # 路径平滑
  allow_unknown: false
  planner_window_x: 0.0
  planner_window_y: 0.0
  default_tolerance: 0.0

  # 启发式
  visualize_potential: false

  # 路径规划频率
  planner_frequency: 1.0
