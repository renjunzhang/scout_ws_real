<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1800" height="800" viewBox="0 0 1800 800"
     role="img" aria-labelledby="title desc">
  <title id="title">Phase-rejoining residual MPC framework</title>
  <desc id="desc">A concise paper framework. A geometric path and frozen models enter a path-indexed speed-profile optimization with delay-aware rollout, producing a complete 22-dimensional nominal artifact with a 9-dimensional empirical gate, a 14-dimensional execution-compatibility set, and bounded recovery feedback. Online, the source-stamped state and transport-receipt command history are aligned to the expected publication epoch. One nearby monotone phase is selected, then one ten-stage residual MPC problem is solved. Full-horizon execution compatibility and the terminal empirical gate admit the residual, while the current empirical gate admits recovery; safety evaluation, priority arbitration, execution-contract finalization, receipt history, and conditional phase commit form the publication chain.</desc>

  <defs>
    <style><![CDATA[
      .canvas {
        fill: #ffffff;
      }
      .scope {
        fill: none;
        stroke: #7699c3;
        stroke-width: 2.2;
        stroke-dasharray: 12 12;
      }
      .box-common {
        fill: #f5f6f7;
        stroke: #707780;
        stroke-width: 2.8;
      }
      .box-method {
        fill: #eaf2fb;
        stroke: #245b9e;
        stroke-width: 3.2;
      }
      .box-core {
        fill: #eaf2fb;
        stroke: #245b9e;
        stroke-width: 4;
      }
      .flow {
        fill: none;
        stroke: #30343b;
        stroke-width: 3.3;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow-gray);
      }
      .artifact {
        fill: none;
        stroke: #5c83b2;
        stroke-width: 2.8;
        stroke-dasharray: 10 8;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .artifact-arrow {
        fill: none;
        stroke: #5c83b2;
        stroke-width: 2.8;
        stroke-dasharray: 10 8;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow-blue);
      }
      .feedback {
        fill: none;
        stroke: #707780;
        stroke-width: 2.8;
        stroke-dasharray: 11 6 2 6;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow-gray);
      }
      .row-label {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 1.1px;
        fill: #30343b;
      }
      .scope-label {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 1.1px;
        fill: #245b9e;
      }
      .box-title {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 30px;
        font-weight: 700;
        fill: #30343b;
        text-anchor: middle;
      }
      .box-title-sm {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #30343b;
        text-anchor: middle;
      }
      .box-text {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 26px;
        font-weight: 400;
        fill: #5d6570;
        text-anchor: middle;
      }
      .math {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-style: italic;
        font-weight: 400;
        fill: #30343b;
        text-anchor: middle;
      }
      .line-label {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 23px;
        font-weight: 600;
        fill: #5d6570;
        text-anchor: middle;
      }
      .artifact-label {
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        font-size: 23px;
        font-weight: 600;
        fill: #416a9b;
        text-anchor: middle;
      }
    ]]></style>

    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#30343b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c83b2"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="800"/>

  <!-- The dashed boundary separates the proposed method from task inputs and the plant. -->
  <rect class="scope" x="330" y="34" width="1090" height="672" rx="15"/>
  <rect class="canvas" x="350" y="22" width="265" height="27"/>
  <text class="scope-label" x="358" y="43">PROPOSED METHOD</text>

  <text class="row-label" x="42" y="76">BEFORE EXECUTION</text>
  <text class="row-label" x="42" y="446">ONLINE · 30 Hz</text>

  <!-- Before-execution planning -->
  <rect class="box-common" x="40" y="108" width="280" height="164" rx="10"/>
  <text class="box-title-sm" x="180" y="147">Geometric path</text>
  <text class="box-title-sm" x="180" y="181">+ frozen models</text>
  <text class="box-text" x="180" y="221">execution + liquid</text>
  <text class="box-text" x="180" y="252">container + constraints</text>

  <rect class="box-method" x="400" y="108" width="330" height="164" rx="10"/>
  <text class="box-title-sm" x="565" y="151">Speed-profile search</text>
  <text class="box-text" x="565" y="197">8 path-indexed scale knots</text>
  <text class="box-text" x="565" y="234">delay-aware rollout + audit</text>

  <rect class="box-method" x="820" y="108" width="500" height="164" rx="10"/>
  <text class="box-title" x="1070" y="143">Phase-indexed offline artifact</text>
  <text class="box-text" x="1070" y="184">22-D nominal + inputs</text>
  <text class="box-text" x="1070" y="221">9-D gate · 14-D B_exec</text>
  <text class="box-text" x="1070" y="252">feedback · settle–hold tail</text>

  <path class="flow" d="M 320 190 H 400"/>
  <path class="flow" d="M 730 190 H 820"/>

  <!-- The frozen artifact supplies the online alignment, residual OCP and rejoin test. -->
  <path class="artifact" d="M 1070 272 V 359 H 500"/>
  <path class="artifact" d="M 1070 359 H 1220"/>
  <path class="artifact-arrow" d="M 500 359 V 482"/>
  <path class="artifact-arrow" d="M 860 359 V 482"/>
  <path class="artifact-arrow" d="M 1220 359 V 482"/>
  <text class="artifact-label" x="860" y="340">frozen nominal, gates, B_exec and recovery feedback</text>

  <!-- Online feedback control -->
  <rect class="box-common" x="40" y="482" width="280" height="168" rx="10"/>
  <text class="box-title-sm" x="180" y="520">Timestamped state</text>
  <text class="box-title-sm" x="180" y="554">+ receipt history</text>
  <text class="box-text" x="180" y="598">robot + liquid estimate</text>
  <text class="box-text" x="180" y="631">delivered commands</text>

  <rect class="box-method" x="350" y="482" width="300" height="168" rx="10"/>
  <text class="box-title-sm" x="500" y="524">Publication-epoch</text>
  <text class="box-title-sm" x="500" y="558">alignment + phase</text>
  <text class="box-text" x="500" y="600">22-D aligned state</text>
  <text class="box-text" x="500" y="632">phase + causal witness</text>

  <rect class="box-core" x="700" y="482" width="320" height="168" rx="10"/>
  <text class="box-title-sm" x="860" y="518">10-stage 22-D</text>
  <text class="box-title-sm" x="860" y="551">residual MPC</text>
  <text class="math" x="860" y="594">N = 10 = 7 + 3</text>
  <text class="box-text" x="860" y="630">published-rate input</text>

  <rect class="box-method" x="1070" y="482" width="300" height="168" rx="10"/>
  <text class="box-title-sm" x="1220" y="518">B_exec + gate audit</text>
  <text class="box-title-sm" x="1220" y="551">+ supervisor</text>
  <text class="box-text" x="1220" y="593">terminal gate → residual</text>
  <text class="box-text" x="1220" y="629">current gate → recovery / stop</text>

  <rect class="box-common" x="1470" y="482" width="290" height="168" rx="10"/>
  <text class="box-title-sm" x="1615" y="510">Safety → arbitration</text>
  <text class="box-title-sm" x="1615" y="542">Final publication</text>
  <text class="box-text" x="1615" y="578">execution finalizer</text>
  <text class="box-text" x="1615" y="608">sink receipt → history</text>
  <text class="box-text" x="1615" y="638">guarded phase commit</text>

  <path class="flow" d="M 320 566 H 350"/>
  <path class="flow" d="M 650 566 H 700"/>
  <path class="flow" d="M 1020 566 H 1070"/>
  <path class="flow" d="M 1370 566 H 1470"/>

  <path class="feedback" d="M 1615 650 V 746 H 180 V 650"/>
  <text class="line-label" x="900" y="738">source-stamped state and transport-receipt command history</text>
</svg>
