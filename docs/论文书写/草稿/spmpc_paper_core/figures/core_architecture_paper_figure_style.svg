<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1800" height="1000" viewBox="0 0 1800 1000"
     role="img" aria-labelledby="title desc">
  <title id="title">Execution-front-aligned phase-rejoining residual S-MPCC architecture</title>
  <desc id="desc">OfflineSloshOCP produces a frozen phase-indexed artifact. Online source and publication alignment, monotone neighboring phase selection, a dual-channel delay-augmented residual OCP, an empirical terminal gate intersected with execution compatibility, and a three-branch supervisor feed one unified publication and safety chain.</desc>

  <defs>
    <style><![CDATA[
      .canvas { fill: #ffffff; }
      .lane-offline { fill: #f7f9fc; stroke: #9bb6d4; stroke-width: 2.2; }
      .lane-online { fill: #f4faf8; stroke: #83bbaa; stroke-width: 2.2; }
      .lane-exec { fill: #fffaf4; stroke: #d5ad82; stroke-width: 2.2; }
      .tag-offline { fill: #e6eef8; stroke: #5d89b8; stroke-width: 2.2; }
      .tag-online { fill: #e2f2ed; stroke: #3f8d78; stroke-width: 2.2; }
      .tag-exec { fill: #f9eadb; stroke: #b87943; stroke-width: 2.2; }
      .box-offline { fill: #edf3fa; stroke: #477eaf; stroke-width: 2.6; }
      .box-model { fill: #eaf4f7; stroke: #43879d; stroke-width: 2.6; }
      .box-online { fill: #e8f5f0; stroke: #2e816d; stroke-width: 2.6; }
      .box-main { fill: #dcefe9; stroke: #176b59; stroke-width: 3.2; }
      .box-gate { fill: #fff3cc; stroke: #b87808; stroke-width: 3.2; }
      .box-supervisor { fill: #e7f2eb; stroke: #347b5b; stroke-width: 2.8; }
      .box-publish { fill: #e2f1eb; stroke: #28765f; stroke-width: 2.8; }
      .box-plant { fill: #e9f0fa; stroke: #4b79ad; stroke-width: 2.8; }
      .g0 { fill: #fff9e3; stroke: #bd8615; stroke-width: 2.1; stroke-dasharray: 9 6; }
      .flow { fill: none; stroke: #334155; stroke-width: 3.2; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .artifact-bus { fill: none; stroke: #456b94; stroke-width: 2.5; stroke-dasharray: 9 6; stroke-linecap: square; stroke-linejoin: miter; }
      .artifact-arrow { fill: none; stroke: #456b94; stroke-width: 2.5; stroke-dasharray: 9 6; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow-blue); }
      .feedback { fill: none; stroke: #596a7d; stroke-width: 2.8; stroke-dasharray: 12 5 2 5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .figure-title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .tag-text { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #203047; text-anchor: middle; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .box-title-sm { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .box-text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 400; fill: #34445a; text-anchor: middle; }
      .box-text-sm { font-family: Arial, Helvetica, sans-serif; font-size: 18.5px; font-weight: 400; fill: #34445a; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 600; fill: #40516a; text-anchor: middle; }
      .label-green { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #246b57; text-anchor: middle; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 18.5px; font-weight: 600; fill: #5b4937; text-anchor: middle; }
      .branch-pass { fill: #236d50; font-weight: 700; }
      .branch-recover { fill: #8a6515; font-weight: 700; }
      .branch-stop { fill: #a34c36; font-weight: 700; }
    ]]></style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#456b94"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1800" height="1000"/>
  <text class="figure-title" x="900" y="48">Execution-Front-Aligned Phase-Rejoining Residual S-MPCC</text>

  <!-- Offline preparation -->
  <rect class="lane-offline" x="30" y="72" width="1740" height="278" rx="14"/>
  <rect class="tag-offline" x="50" y="91" width="190" height="43" rx="8"/>
  <text class="tag-text" x="145" y="120">OFFLINE</text>

  <rect class="box-offline" x="85" y="151" width="300" height="104" rx="12"/>
  <text class="box-title" x="235" y="184">Frozen task &amp; contract</text>
  <text class="box-text" x="235" y="214">path, container, constraints</text>
  <text class="box-text" x="235" y="239">frames, grid, model and hashes</text>

  <rect class="box-model" x="445" y="151" width="330" height="104" rx="12"/>
  <text class="box-title" x="610" y="184">Execution--liquid model</text>
  <text class="box-text" x="610" y="214">dual delays and actuator lags</text>
  <text class="box-text" x="610" y="239">u_pub → motion → slosh state</text>

  <rect class="box-offline" x="835" y="151" width="300" height="104" rx="12"/>
  <text class="box-title" x="985" y="184">OfflineSloshOCP</text>
  <text class="box-text" x="985" y="214">optimize motion and publication</text>
  <text class="box-text" x="985" y="239">full motion--settle--zero-hold tail</text>

  <rect class="box-offline" x="1195" y="141" width="500" height="124" rx="12"/>
  <text class="box-title" x="1445" y="174">OfflineSloshOCP artifact</text>
  <text class="box-text" x="1445" y="204">phase-indexed nominal augmented sequence</text>
  <text class="box-text" x="1445" y="231">9-D empirical gate R_emp(i) and B_exec(i)</text>
  <text class="box-text" x="1445" y="256">stored recovery action u_rec(i)</text>

  <path class="flow" d="M 385 203 H 445"/>
  <path class="flow" d="M 775 203 H 835"/>
  <path class="flow" d="M 1135 203 H 1195"/>

  <rect class="g0" x="370" y="279" width="1060" height="51" rx="9"/>
  <text class="note" x="900" y="301">G0 before enforce: causal dual-channel front, grid-consistent epochs, and credible full-lead prediction;</text>
  <text class="note" x="900" y="323">the new first action must have a detectable effect at the joint terminal.</text>

  <!-- Online receding horizon -->
  <rect class="lane-online" x="30" y="370" width="1740" height="320" rx="14"/>
  <rect class="tag-online" x="50" y="390" width="190" height="43" rx="8"/>
  <text class="tag-text" x="145" y="419">ONLINE</text>

  <!-- Artifact distribution bus -->
  <path class="artifact-bus" d="M 1445 265 V 446 H 505"/>
  <path class="artifact-bus" d="M 1445 446 H 1548"/>
  <path class="artifact-arrow" d="M 505 446 V 475"/>
  <path class="artifact-arrow" d="M 805 446 V 475"/>
  <path class="artifact-arrow" d="M 1153 446 V 475"/>
  <path class="artifact-arrow" d="M 1548 446 V 475"/>
  <text class="label" x="1110" y="435">frozen model, nominal sequence, gate, compatibility and stored action</text>

  <rect class="box-online" x="60" y="475" width="275" height="145" rx="12"/>
  <text class="box-title-sm" x="197.5" y="506">Source-stamped state</text>
  <text class="box-title-sm" x="197.5" y="533">+ published history</text>
  <text class="box-text-sm" x="197.5" y="565">pose, v / ω, liquid state</text>
  <text class="box-text-sm" x="197.5" y="592">source t_s; u_pub delay history</text>

  <rect class="box-online" x="370" y="475" width="270" height="145" rx="12"/>
  <text class="box-title-sm" x="505" y="506">Source / publication</text>
  <text class="box-title-sm" x="505" y="533">alignment</text>
  <text class="box-text-sm" x="505" y="565">align t_s → estimated publish t</text>
  <text class="box-text-sm" x="505" y="592">u_pub history; dual causality</text>

  <rect class="box-online" x="675" y="475" width="260" height="145" rx="12"/>
  <text class="box-title-sm" x="805" y="506">Neighbor monotone</text>
  <text class="box-title-sm" x="805" y="533">phase selection</text>
  <text class="box-text-sm" x="805" y="565">clock-local candidate indices</text>
  <text class="box-text-sm" x="805" y="592">monotone; no global jumps</text>

  <rect class="box-main" x="970" y="465" width="365" height="165" rx="12"/>
  <text class="box-title-sm" x="1152.5" y="498">Dual-channel delay-augmented</text>
  <text class="box-title-sm" x="1152.5" y="526">residual S-MPCC</text>
  <text class="box-text-sm" x="1152.5" y="558">N_e = n_f + N_l; post-front N_l ≈ 100 ms</text>
  <text class="box-text-sm" x="1152.5" y="586">channel buffers / lags remain in the OCP</text>
  <text class="box-text-sm" x="1152.5" y="613">bounded nominal-relative first action</text>

  <rect class="box-gate" x="1370" y="465" width="355" height="165" rx="12"/>
  <text class="box-title-sm" x="1547.5" y="498">Joint terminal rejoin test</text>
  <text class="box-text-sm" x="1547.5" y="535">9-D empirical gate:</text>
  <text class="box-text-sm" x="1547.5" y="560">e_9 ∈ R_emp(j_e)</text>
  <text class="box-text-sm" x="1547.5" y="587">execution compatibility:</text>
  <text class="box-text-sm" x="1547.5" y="612">e_exec ∈ B_exec(j_e); valid contract</text>

  <path class="flow" d="M 335 548 H 370"/>
  <path class="flow" d="M 640 548 H 675"/>
  <path class="flow" d="M 935 548 H 970"/>
  <path class="flow" d="M 1335 548 H 1370"/>

  <!-- Supervision, publication and plant -->
  <rect class="lane-exec" x="30" y="720" width="1740" height="250" rx="14"/>
  <rect class="tag-exec" x="50" y="740" width="190" height="43" rx="8"/>
  <text class="tag-text" x="145" y="769">EXECUTION</text>

  <path class="flow" d="M 1548 630 V 755 H 515 V 790"/>
  <text class="label-green" x="1070" y="746">solver, joint-terminal and current-contract result</text>

  <rect class="box-supervisor" x="190" y="790" width="650" height="130" rx="12"/>
  <text class="box-title" x="515" y="821">Supervisor: three candidate branches</text>
  <text class="box-text-sm" x="515" y="851"><tspan class="branch-pass">PASS:</tspan><tspan dx="6">joint test → residual first action u_sol</tspan></text>
  <text class="box-text-sm" x="515" y="878"><tspan class="branch-recover">RECOVER:</tspan><tspan dx="6">current gate / action valid → u_rec(j)</tspan></text>
  <text class="box-text-sm" x="515" y="905"><tspan class="branch-stop">FAIL CLOSED:</tspan><tspan dx="6">stale / incompatible / invalid → request (0,0)</tspan></text>

  <rect class="box-publish" x="930" y="790" width="330" height="130" rx="12"/>
  <text class="box-title-sm" x="1095" y="821">Unified publication chain</text>
  <text class="box-text-sm" x="1095" y="851">publication gate → limiter → safety</text>
  <text class="box-text-sm" x="1095" y="878">publish and log final u_pub</text>
  <text class="box-text-sm" x="1095" y="905">write back to both delay buffers</text>

  <rect class="box-plant" x="1370" y="790" width="360" height="130" rx="12"/>
  <text class="box-title" x="1550" y="821">Scout base + liquid</text>
  <text class="box-text-sm" x="1550" y="851">execute v / ω; generate real excitation</text>
  <text class="box-text-sm" x="1550" y="878">odom + IMU close the control loop</text>
  <text class="box-text-sm" x="1550" y="905">RGB is independent evaluation only</text>

  <path class="flow" d="M 840 855 H 930"/>
  <path class="flow" d="M 1260 855 H 1370"/>
  <text class="label" x="1315" y="842">final u_pub</text>

  <path class="feedback" d="M 1550 920 V 950 H 42 V 548 H 60"/>
  <text class="label" x="650" y="943">source-stamped motion feedback and final published-command history</text>
</svg>
